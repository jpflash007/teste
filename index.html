<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#327b66" />
    <title>Garagem do Zeca · Cidade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="#mapa" data-home aria-label="Garagem do Zeca, mapa">
          <span class="brand-mark" aria-hidden="true">GZ</span>
          <span class="brand-name">GARAGEM<br /><b>DO ZECA</b></span>
        </a>
        <div class="wallet" aria-label="Seu dinheiro">
          <span class="wallet-icon" aria-hidden="true">$</span>
          <span id="cash-value">R$ 12.500</span>
        </div>
      </header>

      <section class="game-stage" id="game-stage" aria-live="polite"></section>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <button class="nav-item is-active" data-view="map" aria-selected="true">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15m6-12v15"/></svg></span><span>Mapa</span>
        </button>
        <button class="nav-item" data-view="shop" aria-selected="false">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10h18l-1.5-6h-15L3 10Z"/><path d="M5 10v10h14V10M9 20v-6h6v6"/><path d="M3 10c0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0"/></svg></span><span>Loja</span>
        </button>
        <button class="nav-item" data-view="auction" aria-selected="false">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l9-9m-6-8 9 9M5 7l4-4 8 8-4 4-8-8Z"/><path d="M3 21h18"/></svg></span><span>Leilão</span>
        </button>
        <button class="nav-item" data-view="settings" aria-selected="false">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9L16 20.5h-3l-.3-1.8a8 8 0 0 1-1.7 0l-.3 1.8h-3l-.3-1.7a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a8 8 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9L7.7 8h3l.3 1.8a8 8 0 0 1 1.7 0L13 8h3l.3 1.7a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 1.6Z"/></svg></span><span>Config.</span>
        </button>
      </nav>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
